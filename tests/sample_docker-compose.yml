version: "3.9"
services:
  web:
    image: myapp/web:latest
    ports:
      - "80:80"
    environment:
      - DATABASE_URL=postgres://admin:password123@db:5432/app
    restart: "no"

  db:
    image: postgres:15
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_PASSWORD=password123
    # No volume defined -> data lost on container restart (reliability risk)
